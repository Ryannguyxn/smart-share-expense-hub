spring.application.name=smart-share-expense-hub

# Local PostgreSQL connection. Password is supplied only via an environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_share_expense_hub_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate validates the existing schema; it must never create or alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Repository-level Flyway CLI is the only migration runner.
spring.flyway.enabled=false